name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: mykeibadb-mcp-server-${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mykeibadb-mcp-server-${{ runner.os }}-pip-
            ${{ runner.os }}-pip-

      - name: Install mykeibadb-python
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          python -m pip install "git+https://github.com/KeibaAI-developer/mykeibadb-python.git@develop"
          rm -f "$HOME/.netrc"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run isort check
        run: |
          echo "::group::isort check"
          isort --profile=black --line-length=100 --check-only --diff \
            src/mykeibadb_mcp_server/ \
            tests/
          echo "::endgroup::"

      - name: Run flake8
        run: |
          echo "::group::flake8 check"
          flake8 \
            src/mykeibadb_mcp_server/ \
            tests/ \
            --max-line-length=100 \
            --ignore=E203,W503,ANN101,ANN204,ANN401,D105,D107,D403,D415,DAR101,DAR201,DAR402 \
            --select=E,W,F,N,D \
            --docstring-convention=google \
            --statistics
          echo "::endgroup::"

      - name: Run mypy
        run: |
          echo "::group::mypy check"
          mypy src/mykeibadb_mcp_server/
          echo "::endgroup::"

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: mykeibadb-mcp-server-test-${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mykeibadb-mcp-server-test-${{ runner.os }}-pip-
            ${{ runner.os }}-pip-

      - name: Install mykeibadb-python
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          python -m pip install "git+https://github.com/KeibaAI-developer/mykeibadb-python.git@develop"
          rm -f "$HOME/.netrc"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --cov=mykeibadb_mcp_server \
            --cov-report=xml \
            --cov-report=term-missing \
            || [ $? -eq 5 ]
