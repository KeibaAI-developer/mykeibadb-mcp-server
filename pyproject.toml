[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mykeibadb-mcp-server"
version = "0.1.0"
description = "mykeibadb MCP Server - 競馬データ分析MCPサーバー"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kubo-Tech"},
]
keywords = ["keiba", "jra", "mcp", "mykeibadb", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # MCP SDK 2.0で mcp.server.fastmcp が廃止されたため2.0を除外する
    "mcp[cli]>=1.1.0,<2.0.0",
    "mykeibadb-python",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    # 静的解析の結果を左右するため、mypyと型情報のバージョンは固定する。
    # ruffはci.ymlのRUFF_VERSIONで管理しているためここには書かない。
    "mypy==1.17.1",
    "types-PyYAML==6.0.12.20250915",
]

[project.urls]
Homepage = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server"
Documentation = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server/blob/main/README.md"
Repository = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server"
Issues = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mykeibadb_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

# srcレイアウトのため、ファーストパーティの解決先にsrcを含める。
# 指定しないとmykeibadb_mcp_serverがサードパーティ扱いになりI001が誤検知される。
src = ["src", "."]

# DOCルール（pydoclint相当）がpreview扱いのため有効化する。
# darglintのDAR401/DAR202/DAR301/DAR302を置き換えている。
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D", "I", "DOC"]
ignore = [
    "E203",   # `:` の前のスペース（Black互換）
    "D105",   # マジックメソッドのdocstring
    "D107",   # `__init__` のdocstring
    "D403",   # docstring先頭の大文字化（日本語docstringのため不要）
    "D415",   # docstring末尾のピリオド（日本語docstringのため不要）
    "DOC201", # Returns未記載（自明な場合は省略可）
    "DOC502", # Raisesに実際には送出しない例外を記載
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=mykeibadb_mcp_server",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: 単体テスト",
    "integration: 結合テスト",
]

[tool.coverage.run]
source = ["mykeibadb_mcp_server"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv.sources]
mykeibadb-python = { path = "../mykeibadb-python" }
