[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mykeibadb-mcp-server"
version = "0.1.0"
description = "mykeibadb MCP Server - 競馬データ分析MCPサーバー"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kubo-Tech"},
]
keywords = ["keiba", "jra", "mcp", "mykeibadb", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.1.0",
    "mykeibadb-python",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "flake8-annotations>=3.0.0",
    "darglint>=1.8.0",
    "types-pyyaml>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server"
Documentation = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server/blob/main/README.md"
Repository = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server"
Issues = "https://github.com/KeibaAI-developer/mykeibadb-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mykeibadb_mcp_server"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=mykeibadb_mcp_server",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: 単体テスト",
    "integration: 結合テスト",
]

[tool.coverage.run]
source = ["mykeibadb_mcp_server"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv.sources]
mykeibadb-python = { path = "../mykeibadb-python" }
