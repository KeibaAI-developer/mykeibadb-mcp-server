name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # ruffのバージョンをここで管理する。pyproject.tomlには書かない。
  # library-workflowと版を揃えること。ずれると同じコードでも判定結果が変わる。
  RUFF_VERSION: '0.16.3'

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # setup-uvはv8以降メジャータグ（v10等）を提供していないため完全な
      # コミットSHAで固定する。併せてタグ付け替えによるサプライチェーン
      # リスクも避けられる。
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: mykeibadb-mcp-server

      # ruffはASTだけで動きパッケージ本体を必要としないため、依存の解決を
      # 待たずに先に流す。違反があればインストールを待たずに落ちる。
      # ルールはpyproject.tomlの[tool.ruff]から読む。
      - name: Run ruff
        run: |
          echo "::group::ruff check"
          uvx "ruff@$RUFF_VERSION" check \
            src/ \
            tests/ \
            --output-format=github
          echo "::endgroup::"

      # uv pip installの対象を明示するためvenvを作り、そのbinをPATHに載せる。
      # 以降のmypy・pytestはPATH経由で直接呼べる。
      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install mykeibadb-python
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          uv pip install "git+https://github.com/KeibaAI-developer/mykeibadb-python.git@develop"
          rm -f "$HOME/.netrc"

      # --no-sources で [tool.uv.sources] を無視する。ローカル開発用に
      # mykeibadb-python を隣のディレクトリへ向けているが、CIには存在しない。
      - name: Install dependencies
        run: uv pip install --no-sources -e ".[dev]"

      - name: Run mypy
        run: |
          echo "::group::mypy check"
          mypy src/mykeibadb_mcp_server/
          echo "::endgroup::"

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: mykeibadb-mcp-server-test

      - name: Create virtual environment
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install mykeibadb-python
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_PAT" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          uv pip install "git+https://github.com/KeibaAI-developer/mykeibadb-python.git@develop"
          rm -f "$HOME/.netrc"

      # --no-sources で [tool.uv.sources] を無視する。ローカル開発用に
      # mykeibadb-python を隣のディレクトリへ向けているが、CIには存在しない。
      - name: Install dependencies
        run: uv pip install --no-sources -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --cov=mykeibadb_mcp_server \
            --cov-report=xml \
            --cov-report=term-missing \
            || [ $? -eq 5 ]
